<script>

/* CARD MOUSE EFFECT */

document
    .querySelectorAll(".nav-card")
    .forEach(card => {

        card.addEventListener(
            "pointermove",
            event => {

                const rect =
                    card.getBoundingClientRect();

                card.style.setProperty(
                    "--mouse-x",
                    `${event.clientX - rect.left}px`
                );

                card.style.setProperty(
                    "--mouse-y",
                    `${event.clientY - rect.top}px`
                );
            }
        );
    });

</script>

<script>
    const onlineSince = new Date(2026, 8, 24, 1, 49, 24);
    const uptime = document.getElementById("uptime");

    function updateUptime() {
        const elapsed = Math.max(0, Math.floor((Date.now() - onlineSince.getTime()) / 1000));
        const days = Math.floor(elapsed / 86400);
        const hours = Math.floor((elapsed % 86400) / 3600);
        const minutes = Math.floor((elapsed % 3600) / 60);
        const seconds = elapsed % 60;
        uptime.textContent = `${days}D ${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    updateUptime();
    setInterval(updateUptime, 1000);
</script>
