<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE — Contact</title>
<link rel="stylesheet" href="../assets/tailwind.css">
<style>
    .construction-hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 100px 0;
        min-height: 70vh;
    }
    .blinking-cursor {
        animation: blink 1s step-end infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
</style>
</head>
<body>

<div class="bg">
    <canvas id="particles"></canvas>
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
    <div class="bg-noise"></div>
</div>

<div class="page">
    <header class="site-header">
        <a href="../index.html" class="logo">SPACE</a>
        <a href="library.html" class="header-link">← LIBRARY</a>
    </header>

    <main class="construction-hero">
        <span class="eyebrow">[ SYSTEM BUILDING<span class="blinking-cursor">_</span> ]</span>
        <h1 class="display-title" style="font-size: clamp(40px, 8vw, 80px);">
            UNDER<br><span>CONSTRUCTION.</span>
        </h1>
        <p class="body-text" style="margin-top: 30px; text-align: center;">
            The CONTACT module is currently being assembled.<br>Please check back later.
        </p>
    </main>

    <footer class="site-footer">
        <span>SPACE / CONTACT</span>
        <span>EST. 2026</span>
    </footer>
</div>

<script src="../assets/particles.js"></script>
</body>
</html>
